<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Your agents connect to the shared system you own</title>
<desc id="desc">Three people use their own agents, each with its own model, harness and tools. Separate MCP connectors expose Search, Read and Write. The agents connect to Commons, which keeps its API and shared PostgreSQL knowledge outside the agents. Arrows show two-way access.</desc>
