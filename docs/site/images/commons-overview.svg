<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Your agents. Your shared knowledge.</title><desc id="desc">Multiple people bring their own agents. Each agent has a harness, model and other tools. Commons search, read and write tools are exposed through MCP and reach the authenticated API, which accesses PostgreSQL. People can also use the browser UI.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37856B" /></marker></defs><rect width="1280" height="820" fill="white" />
<text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#16392E" text-anchor="start">Your agents. Your shared knowledge.</text>
<text x="48" y="88" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#53675F" text-anchor="start">Choose different agents. Keep useful knowledge together.</text>
<text x="228" y="139" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#16392E" text-anchor="middle">Person A</text>
<rect x="48" y="160" width="360" height="132" rx="14" fill="white" stroke="#94B2A4" stroke-width="2" />
<text x="70" y="195" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#16392E" text-anchor="start">Agent A</text>
<text x="70" y="226" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53675F" text-anchor="start">Harness + model</text>
<text x="70" y="251" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53675F" text-anchor="start">Other tools + Commons tools</text>
<path d="M 228 292 V 330" fill="none" stroke="#37856B" stroke-width="2.4" stroke-linejoin="round" />
