<text x="272" y="391" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#16392E" text-anchor="start">MCP connection</text>
<text x="272" y="422" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53675F" text-anchor="start">commons_search     ·     commons_read     ·     commons_write</text>
<text x="620" y="495" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#37856B" text-anchor="middle">Read knowledge → do work → save useful findings</text>
