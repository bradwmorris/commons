<path d="M 318 591 H 400" fill="none" stroke="#37856B" stroke-width="2.4" stroke-linejoin="round" />
<text x="620" y="802" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53675F" text-anchor="middle">Agents run in their own environments. Commons holds the shared knowledge.</text>
